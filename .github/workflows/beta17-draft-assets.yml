name: Validate and attach beta17 draft assets
on:
  push:
    branches: [automation/beta17-draft-assets]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta17-draft-assets
  cancel-in-progress: false
jobs:
  windows-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and unpack the exact candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $pwd 'release-candidates/beta17'
          $zip = Join-Path $base 'Autodesk-MCP-Connector-1.0.0-beta.17.zip'
          $manifest = Get-Content (Join-Path $base 'latest.json') -Raw | ConvertFrom-Json
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $manifest.sha256) { throw 'Checksum mismatch' }
          if ($manifest.version -ne '1.0.0-beta.17') { throw 'Wrong release version' }
          Expand-Archive $zip (Join-Path $base 'unpacked')
          $share = Join-Path $base 'unpacked/Autodesk-MCP-Connector-1.0.0-beta.17'
          Expand-Archive (Join-Path $share 'Support/Autodesk-MCP-Payload.zip') (Join-Path $base 'source')
          Move-Item (Join-Path $base 'source/Autodesk-MCP-Payload') (Join-Path $base 'source/runtime')
      - name: Windows PowerShell 5.1 regression checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/windows-checks.py --phase regression
      - name: Windows installer interface smoke test
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/windows-checks.py --phase ui
  attach-draft:
    needs: windows-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Attach verified files without publishing the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/attach-beta17.py
